<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="StayShay logo"><style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500&amp;display=swap');.w{font-family:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;font-weight:500;letter-spacing:-1px}</style><style>.fa1,.fa2{transform-box:view-box}
.fa1{animation:faa 5s cubic-bezier(.2,.9,.25,1.15) infinite}.fa2{animation:fab 5s cubic-bezier(.2,.9,.25,1.15) infinite}
.fag{animation:fag 5s infinite}.faw{animation:faw 5s cubic-bezier(.2,.8,.2,1) infinite}.faall{animation:faf 5s infinite}
@keyframes faa{0%{transform:translate(-260px,140px);opacity:0}6%{opacity:1}26%,100%{transform:none;opacity:1}}
@keyframes fab{0%,8%{transform:translate(260px,-140px);opacity:0}14%{opacity:1}30%,100%{transform:none;opacity:1}}
